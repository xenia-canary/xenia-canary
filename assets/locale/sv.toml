"Simple bilinear filtering is done if resampling is needed.\nOtherwise, only anti-aliasing is done if enabled, or displaying as is." = "Enkel bilinjär filtrering används om omsampling behövs.\nAnnars används bara kantutjämning om den är aktiverad, eller så visas bilden som den är."
"Sharpening and resampling to up to 2x2 to improve the fidelity of details.\nFor scaling by more than 2x2, bilinear stretching is done afterwards." = "Skärpning och omsampling upp till 2×2 för bättre detaljåtergivning.\nVid skalning över 2×2 används bilinjär utsträckning efteråt."
"High-quality edge-preserving upscaling to arbitrary target resolutions.\nFor scaling by more than 2x2, multiple upsampling passes are done.\nIf not upscaling, Contrast Adaptive Sharpening (CAS) is used instead." = "Kantbevarande uppskalning av hög kvalitet till valfri målopplösning.\nVid skalning över 2×2 används flera uppskalningspass.\nOm ingen uppskalning används används Contrast Adaptive Sharpening (CAS) i stället."
"FXAA is highly recommended when using CAS or FSR." = "FXAA rekommenderas starkt när CAS eller FSR används."
"FSR sharpness reduction when upscaling (lower is sharper):" = "FSR-skärpereduktion vid uppskalning (lägre är skarpare):"
